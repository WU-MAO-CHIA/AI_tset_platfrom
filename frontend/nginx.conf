server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 附件上傳上限：影片 100MB（見 backend media_service.VIDEO_MAX_BYTES）
    client_max_body_size 110m;

    # 只信任來自本機／容器網路（前面的 Caddy）的 X-Forwarded-For，由右往左取第一個不受信任的位址。
    # 直接從外網連進來的請求，client 自己偽造的 X-Forwarded-For 會被忽略（登入限流依真實 IP 計算）。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr 已由上方 real_ip 換成真正的 client IP；不沿用 client 自己送來的值
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 執行串流最長 10 分鐘且中途可能長時間沒有事件；LLM 生成約 35 秒。
        # SSE 回應帶 X-Accel-Buffering: no，nginx 會自動關閉該回應的緩衝。
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Vite 產出的檔名含雜湊，可長期快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA：前端路由一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
